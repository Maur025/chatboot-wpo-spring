services:
  chatboot-wp-db:
    image: ${POSTGRESQL_IMAGE}
    restart: unless-stopped
    hostname: chatboot-wp-db
    container_name: chatboot-wp-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatboot-wp-db:/var/lib/postgresql/data
      - ./init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
      - ./dumps:/dumps
    networks:
      - compose-net

volumes:
  chatboot-wp-db:

networks:
  compose-net:
    external: true